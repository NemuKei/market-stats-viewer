name: Prepare auto-publish provenance documentation

on:
  push:
    branches:
      - chore/auto-publish-external-events-on-push
    paths:
      - .github/workflows/prepare_auto_publish_pr.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/auto-publish-external-events-on-push
          fetch-depth: 0

      - name: Sync specification and decision record
        run: |
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected block not found: {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")


          spec_path = Path("docs/spec_update_pipeline.md")
          replace_once(
              spec_path,
              "    - 対象path: `.github/workflows/publish_external_events_assets.yml`, `data/events.sqlite`, `data/event_signals.sqlite`, `data/lp_events.json`",
              "    - 対象path: `.github/workflows/publish_external_events_assets.yml`, `scripts/build_external_events_manifest.py`, `data/events.sqlite`, `data/event_signals.sqlite`, `data/lp_events.json`",
          )
          replace_once(
              spec_path,
              "    - ローカルcheckoutやCodex Automationから直接pushされた更新を自動公開する。公開workflow自身の変更も対象に含め、導入PRのmerge直後に現行assetを再公開する。",
              "    - ローカルcheckoutやCodex Automationから直接pushされた配布入力またはmanifest生成処理の更新を自動公開する。push起点ではtrigger commitをcheckoutして、manifestの`source_commit_sha`とasset内容を一致させる。公開workflow自身の変更も対象に含め、導入PRのmerge直後に現行assetを再公開する。",
          )

          decisions_path = Path("docs/context/DECISIONS.md")
          replace_once(
              decisions_path,
              "- D-20260905-001 | 外部イベント配布は GitHub Release assets（tag: `external-events-latest`）を正とする。GitHub Actions内の更新は `workflow_run`、ローカルcheckoutやCodex Automationから`main`へ直接pushされた `events.sqlite` / `event_signals.sqlite` / `lp_events.json` の更新はpath限定の `push` で自動公開し、`workflow_dispatch` を手動復旧経路として残す | status: applied | spec_link: docs/spec_update_pipeline.md",
              "- D-20260905-001 | 外部イベント配布は GitHub Release assets（tag: `external-events-latest`）を正とする。GitHub Actions内の更新は `workflow_run`、ローカルcheckoutやCodex Automationから`main`へ直接pushされた配布入力またはmanifest生成処理の更新はpath限定の `push` で自動公開し、push起点ではtrigger commitへ固定する。`workflow_dispatch` は手動復旧経路として残す | status: applied | spec_link: docs/spec_update_pipeline.md",
          )
          PY

      - name: Verify focused contract
        run: |
          python tests/test_publish_external_events_workflow.py
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/publish_external_events_assets.yml")'
          git diff --check

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/spec_update_pipeline.md docs/context/DECISIONS.md
          git commit -m "docs: pin direct-push publication provenance"
          git pull --rebase origin chore/auto-publish-external-events-on-push
          git push origin HEAD:chore/auto-publish-external-events-on-push
