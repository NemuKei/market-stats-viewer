name: Prepare auto-publish PR documentation

on:
  push:
    branches:
      - chore/auto-publish-external-events-on-push
    paths:
      - .github/workflows/prepare_auto_publish_pr.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/auto-publish-external-events-on-push
          fetch-depth: 0

      - name: Patch specs and add regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          spec_path = Path("docs/spec_update_pipeline.md")
          spec = spec_path.read_text(encoding="utf-8")
          old_trigger = """- Trigger:
            - `workflow_run`（`Update events official data` / `Update event signals data (News)` / `Update event signals data (Ticketjam)` / `Update event signals data (Venue Web Discovery)` が `main` で成功したとき）
            - `workflow_dispatch`（手動再公開）"""
          new_trigger = """- Trigger:
            - `push`（`main` で配布入力または公開workflowが更新されたとき）
              - 対象path: `.github/workflows/publish_external_events_assets.yml`, `data/events.sqlite`, `data/event_signals.sqlite`, `data/lp_events.json`
              - ローカルcheckoutやCodex Automationから直接pushされた更新を自動公開する。公開workflow自身の変更も対象に含め、導入PRのmerge直後に現行assetを再公開する。
            - `workflow_run`（`Update events official data` / `Update event signals data (News)` / `Update event signals data (Ticketjam)` / `Update event signals data (Venue Web Discovery)` が `main` で成功したとき）
              - GitHub Actionsが`GITHUB_TOKEN`で作成したcommitは後続の`push` workflowを起動しないため、scheduled/manualの上流workflow経路として維持する。
            - `workflow_dispatch`（手動再公開）"""
          if old_trigger not in spec:
              raise SystemExit("spec trigger block not found")
          spec = spec.replace(old_trigger, new_trigger, 1)

          old_retry = """- 再実行手順:
            1. upstream workflow が `main` で `success` なのに release asset が更新されていない場合は、`publish_external_events_assets.yml` を `workflow_dispatch` で手動実行する
            2. upstream workflow が `failure` / `cancelled` / `skipped` の場合は、先に upstream workflow を復旧または再実行し、その後に `publish_external_events_assets.yml` を手動実行する
            3. 確認は GitHub Release `external-events-latest` の asset `updated_at` と `manifest.json` の `generated_at_utc` を見る"""
          new_retry = """- 再実行手順:
            1. ローカルcheckoutやCodex Automationから`main`へ対象pathを直接pushした場合は`push` run、上流GitHub Actionsが完了した場合は`workflow_run` runを確認する
            2. publish run が `failure` / `cancelled` の場合は原因を修正して再実行する。上流workflowが `failure` / `cancelled` / `skipped` の場合は、先に上流workflowを復旧または再実行する
            3. 対象更新後にpublish runが存在しない、またはrelease assetが更新されていない場合は、`publish_external_events_assets.yml` を `workflow_dispatch` で手動実行する
            4. 確認は GitHub Release `external-events-latest` の asset `updated_at` と `manifest.json` の `generated_at_utc` / `source_commit_sha` を見る"""
          if old_retry not in spec:
              raise SystemExit("spec retry block not found")
          spec_path.write_text(spec.replace(old_retry, new_retry, 1), encoding="utf-8")

          decisions_path = Path("docs/context/DECISIONS.md")
          decisions = decisions_path.read_text(encoding="utf-8")
          old_decision = "- D-20260225-006 | 外部連携（BCL）向け配布は GitHub Release assets（tag: `external-events-latest`）を正とし、`events.sqlite` / `event_signals.sqlite` / `manifest.json` を workflow_run で自動上書き公開する | status: applied | spec_link: docs/spec_update_pipeline.md"
          superseded_decision = "- D-20260225-006 | 外部連携（BCL）向け配布は GitHub Release assets（tag: `external-events-latest`）を正とし、`events.sqlite` / `event_signals.sqlite` / `manifest.json` を workflow_run で自動上書き公開する | status: superseded_by_D-20260905-001 | spec_link: docs/spec_update_pipeline.md"
          if old_decision not in decisions:
              raise SystemExit("decision D-20260225-006 not found")
          decisions = decisions.replace(old_decision, superseded_decision, 1)
          new_decision = "- D-20260905-001 | 外部イベント配布は GitHub Release assets（tag: `external-events-latest`）を正とする。GitHub Actions内の更新は `workflow_run`、ローカルcheckoutやCodex Automationから`main`へ直接pushされた `events.sqlite` / `event_signals.sqlite` / `lp_events.json` の更新はpath限定の `push` で自動公開し、`workflow_dispatch` を手動復旧経路として残す | status: applied | spec_link: docs/spec_update_pipeline.md"
          if new_decision not in decisions:
              decisions = decisions.rstrip() + "\n" + new_decision + "\n"
          decisions_path.write_text(decisions, encoding="utf-8")
          PY

          cat > tests/test_publish_external_events_workflow.py <<'PYTEST'
          from pathlib import Path
          import unittest


          WORKFLOW_PATH = Path(".github/workflows/publish_external_events_assets.yml")


          class PublishExternalEventsWorkflowTest(unittest.TestCase):
              @classmethod
              def setUpClass(cls) -> None:
                  cls.workflow = WORKFLOW_PATH.read_text(encoding="utf-8")

              def test_direct_main_pushes_trigger_publication(self) -> None:
                  push_block = self.workflow.split("  push:\n", 1)[1].split(
                      "  workflow_dispatch:\n", 1
                  )[0]
                  self.assertIn("    branches:\n      - main\n", push_block)
                  for path in (
                      ".github/workflows/publish_external_events_assets.yml",
                      "data/events.sqlite",
                      "data/event_signals.sqlite",
                      "data/lp_events.json",
                  ):
                      self.assertIn(f"      - {path}\n", push_block)
                  self.assertIn("github.event_name == 'push'", self.workflow)

              def test_existing_automatic_and_manual_routes_remain(self) -> None:
                  self.assertIn("  workflow_dispatch:\n", self.workflow)
                  self.assertIn("  workflow_run:\n", self.workflow)
                  for workflow_name in (
                      "Update events official data",
                      "Update event signals data (News)",
                      "Update event signals data (Ticketjam)",
                      "Update event signals data (Venue Web Discovery)",
                  ):
                      self.assertIn(f"      - {workflow_name}\n", self.workflow)
                  self.assertIn(
                      "github.event.workflow_run.conclusion == 'success'", self.workflow
                  )
                  self.assertIn(
                      "github.event.workflow_run.head_branch == 'main'", self.workflow
                  )


          if __name__ == "__main__":
              unittest.main()
          PYTEST

      - name: Verify focused contract
        run: |
          python tests/test_publish_external_events_workflow.py
          git diff --check

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/spec_update_pipeline.md docs/context/DECISIONS.md tests/test_publish_external_events_workflow.py
          git commit -m "docs: define direct-push event asset publishing"
          git push origin HEAD:chore/auto-publish-external-events-on-push
