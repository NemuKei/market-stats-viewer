name: Update event signals data (News)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours (UTC)

concurrency:
  group: repo-write-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install deps
        run: |
          uv sync --frozen --no-dev

      - name: Update event signals
        run: |
          uv run python -m scripts.update_event_signals_data --only starto_concert,kstyle_music

      - name: Build ticketjam supplement report
        run: |
          uv run python -m scripts.build_ticketjam_supplement_report

      - name: Build LP events
        run: |
          uv run python -m scripts.build_lp_events

      - name: Commit changes (if any)
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/ scripts/ app.py docs/ pyproject.toml uv.lock README.md
            git commit -m "chore: update event signals data (news)"
            bash .github/scripts/push_generated_data.sh
          else
            echo "No changes to commit."
          fi
