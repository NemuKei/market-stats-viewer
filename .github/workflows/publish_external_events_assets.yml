name: Publish external events assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish_external_events_assets.yml
      - scripts/build_external_events_manifest.py
      - scripts/build_all_dates_lp_events.py
      - scripts/validate_external_events.py
      - scripts/upload_release_assets.py
      - data/events.sqlite
      - data/event_signals.sqlite
      - data/lp_events.json
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update events official data
      - Update event signals data (News)
      - Update event signals data (Venue Web Discovery)
    types:
      - completed

concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install retained-event builder dependency
        # publication_filter imports the signal-source base; match pyproject.toml.
        run: python -m pip install requests==2.32.3

      - name: Build manifest
        run: |
          source_sha="$(git rev-parse HEAD)"
          python -m scripts.build_all_dates_lp_events
          GITHUB_SHA="$source_sha" python -m scripts.build_external_events_manifest --release-tag external-events-latest
          python -m scripts.validate_external_events \
            --require-all-dates \
            --expected-commit "$source_sha" \
            --expected-as-of-date "$(TZ=Asia/Tokyo date +%F)"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="external-events-latest"
          title="External Events (latest)"
          notes="Validated event databases, LP events, and integrity manifest."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" --title "$title" --notes "$notes"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.upload_release_assets --tag external-events-latest \
            data/events.sqlite data/event_signals.sqlite data/lp_events.json data/lp_events_all.json data/manifest.json
