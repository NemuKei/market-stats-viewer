name: Publish external events assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish_external_events_assets.yml
      - scripts/build_external_events_manifest.py
      - scripts/build_all_dates_lp_events.py
      - scripts/validate_external_events.py
      - scripts/upload_release_assets.py
      - scripts/build_public_schedule_days.py
      - data/public_schedule_days.json
      - data/public_schedule_baseline.json
      - data/events.sqlite
      - data/event_signals.sqlite
      - data/lp_events.json
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update events official data
      - Update event signals data (News)
      - Update event signals data (Venue Web Discovery)
    types:
      - completed

concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      # No bootstrap or real pins are committed. Missing configuration stays disabled.
      PUBLIC_SCHEDULE_DAYS_ENABLED: ${{ vars.PUBLIC_SCHEDULE_DAYS_ENABLED == 'true' && 'true' || 'false' }}
      PUBLIC_SCHEDULE_DAYS_SHA256: ${{ vars.PUBLIC_SCHEDULE_DAYS_SHA256 }}
      PUBLIC_SCHEDULE_BASELINE_SHA256: ${{ vars.PUBLIC_SCHEDULE_BASELINE_SHA256 }}
      PUBLIC_SCHEDULE_APPROVAL_SHA256: ${{ vars.PUBLIC_SCHEDULE_APPROVAL_SHA256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install retained-event builder dependency
        # publication_filter imports the signal-source base; match pyproject.toml.
        run: python -m pip install requests==2.32.3

      - name: Build manifest
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          public_manifest_args=()
          public_validation_args=()
          if [[ "$PUBLIC_SCHEDULE_DAYS_ENABLED" == "true" ]]; then
            public_pins=(--expected-public-schedule-sha256 "$PUBLIC_SCHEDULE_DAYS_SHA256"
              --expected-public-baseline-sha256 "$PUBLIC_SCHEDULE_BASELINE_SHA256"
              --expected-approval-set-sha256 "$PUBLIC_SCHEDULE_APPROVAL_SHA256")
            public_manifest_args=(--include-public-schedule-days "${public_pins[@]}")
            public_validation_args=(--require-public-schedule-days "${public_pins[@]}")
          fi
          python -m scripts.build_all_dates_lp_events
          GITHUB_SHA="$source_sha" python -m scripts.build_external_events_manifest --release-tag external-events-latest "${public_manifest_args[@]}"
          python -m scripts.validate_external_events \
            --require-all-dates \
            --expected-commit "$source_sha" \
            --expected-as-of-date "$(TZ=Asia/Tokyo date +%F)" "${public_validation_args[@]}"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="external-events-latest"
          title="External Events (latest)"
          notes="Validated event databases, LP events, and integrity manifest."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" --title "$title" --notes "$notes"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(data/events.sqlite data/event_signals.sqlite data/lp_events.json data/lp_events_all.json)
          if [[ "$PUBLIC_SCHEDULE_DAYS_ENABLED" == "true" ]]; then
            assets+=(data/public_schedule_days.json data/public_schedule_baseline.json)
          fi
          assets+=(data/manifest.json)
          python -m scripts.upload_release_assets --tag external-events-latest "${assets[@]}"
